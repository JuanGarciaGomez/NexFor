# ─────────────────────────────────────────────────────────────
# .github/workflows/git-flow-checks.yml
#
# Validates that PRs follow Git Flow rules:
#   1. PR title starts with a valid Conventional Commits type (case-insensitive)
#   2. Source branch name starts with a valid Git Flow prefix
#   3. Target branches are protected according to Git Flow
#   4. The Android app compiles successfully
# ─────────────────────────────────────────────────────────────

name: Git Flow & Build Checks

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
    branches:
      - main
      - develop
      - "release/**"

jobs:
  # ── 1. Validates PR title type (Relaxed) ───────────────────
  validate-pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title prefix
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(.*):.+"
          if ! echo "$PR_TITLE" | grep -qiE "$PATTERN"; then
            echo "✗ Invalid PR title: '$PR_TITLE'"
            echo ""
            echo "Required format: <type>: <description>  (scope is optional)"
            echo "Valid types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "✓ Valid PR title format: '$PR_TITLE'"

  # ── 2. Validates source branch prefix (Relaxed) ────────────
  validate-branch-name:
    name: Branch Name Prefix
    runs-on: ubuntu-latest
    steps:
      - name: Check branch prefix
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          EXEMPT="^(main|develop)$"
          VALID="^(feature|bugfix|hotfix|task|release|chore)\/.+"

          if echo "$BRANCH" | grep -qE "$EXEMPT"; then
            echo "✓ Exempt branch: '$BRANCH'"
            exit 0
          fi

          if ! echo "$BRANCH" | grep -qE "$VALID"; then
            echo "✗ Invalid branch prefix: '$BRANCH'"
            echo ""
            echo "Must start with: feature/, bugfix/, hotfix/, task/, release/, or chore/"
            exit 1
          fi
          echo "✓ Valid branch prefix: '$BRANCH'"

  # ── 3. Ensures main only receives release/* or hotfix/* ────
  validate-target-main:
    name: Protect main
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Check source branch for main
        env:
          SOURCE: ${{ github.head_ref }}
        run: |
          ALLOWED="^(release|hotfix)\/"
          if ! echo "$SOURCE" | grep -qE "$ALLOWED"; then
            echo "✗ Branch '$SOURCE' is not allowed to target main"
            exit 1
          fi
          echo "✓ Source branch allowed for main"

  # ── 4. Ensures develop only receives feature/*, bugfix/*, task/* or chore/* ──
  validate-target-develop:
    name: Protect develop
    runs-on: ubuntu-latest
    if: github.base_ref == 'develop'
    steps:
      - name: Check source branch for develop
        env:
          SOURCE: ${{ github.head_ref }}
        run: |
          ALLOWED="^(feature|bugfix|task|chore)\/"
          if ! echo "$SOURCE" | grep -qE "$ALLOWED"; then
            echo "✗ Branch '$SOURCE' is not allowed to target develop"
            exit 1
          fi
          echo "✓ Source branch allowed for develop"

  # ── 5. Ensures release/* only receives bugfix/* or chore/* ─
  validate-target-release:
    name: Protect release
    runs-on: ubuntu-latest
    if: startsWith(github.base_ref, 'release/')
    steps:
      - name: Check source branch for release
        env:
          SOURCE: ${{ github.head_ref }}
        run: |
          ALLOWED="^(bugfix|chore)\/"
          if ! echo "$SOURCE" | grep -qE "$ALLOWED"; then
            echo "✗ Branch '$SOURCE' is not allowed to target a release branch"
            exit 1
          fi
          echo "✓ Source branch allowed for release"

  # ── 6. BUILD CHECK: Compile Android App ────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Android Debug
        run: ./gradlew :androidApp:assembleDebug

  # ── 7. Summary — all jobs must pass or be intentionally skipped ──
  summary:
    name: PR Checks Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate-pr-title
      - validate-branch-name
      - validate-target-main
      - validate-target-develop
      - validate-target-release
      - build-android
    steps:
      - name: Evaluate all job results
        env:
          PR_TITLE: ${{ needs.validate-pr-title.result }}
          BRANCH_NAME: ${{ needs.validate-branch-name.result }}
          TARGET_MAIN: ${{ needs.validate-target-main.result }}
          TARGET_DEVELOP: ${{ needs.validate-target-develop.result }}
          TARGET_RELEASE: ${{ needs.validate-target-release.result }}
          BUILD_ANDROID: ${{ needs.build-android.result }}
        run: |
          for RESULT in "$PR_TITLE" "$BRANCH_NAME" "$TARGET_MAIN" "$TARGET_DEVELOP" "$TARGET_RELEASE" "$BUILD_ANDROID"; do
            if [[ "$RESULT" != "success" && "$RESULT" != "skipped" ]]; then
              echo "✗ One or more checks failed — merge is blocked"
              exit 1
            fi
          done
          echo "✓ All checks passed successfully"