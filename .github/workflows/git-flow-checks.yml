# ─────────────────────────────────────────────────────────────
# .github/workflows/git-flow-checks.yml
#
# Validates that PRs follow Git Flow rules:
#   1. PR title follows Conventional Commits format
#   2. Source branch name follows Git Flow naming convention
#   3. PRs targeting main must come from release/* or hotfix/*
#   4. PRs targeting develop must come from feature/*, bugfix/*, task/* or chore/*
#   5. PRs targeting release/* must come from bugfix/* or chore/*
# ─────────────────────────────────────────────────────────────

name: Git Flow Checks

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]
    branches:
      - main
      - develop
      - "release/**"

jobs:
  # ── 1. Validates PR title against Conventional Commits ─────
  validate-pr-title:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PATTERN="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?(!)?: .{1,100}$"
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "✗ Invalid PR title: '$PR_TITLE'"
            echo ""
            echo "Required format: <type>(<scope>): <description>"
            echo ""
            echo "Valid types:      feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            echo "Suggested scopes: android, ios, shared, auth, ui, network, db, navigation"
            echo ""
            echo "Examples:"
            echo "  feat(android): add profile screen"
            echo "  fix(shared): fix crash on serialization"
            echo "  chore(deps): update Ktor to 3.1.0"
            exit 1
          fi
          echo "✓ Valid PR title: '$PR_TITLE'"

  # ── 2. Validates source branch naming convention ───────────
  validate-branch-name:
    name: Branch Name (Git Flow)
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          EXEMPT="^(main|develop)$"
          VALID="^(feature|bugfix|hotfix|task|release|chore)\/([A-Z]+-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*|[0-9]+\.[0-9]+\.[0-9]+|[a-z0-9]+(-[a-z0-9]+)*)$"

          if echo "$BRANCH" | grep -qE "$EXEMPT"; then
            echo "✓ Exempt branch: '$BRANCH'"
            exit 0
          fi

          if ! echo "$BRANCH" | grep -qE "$VALID"; then
            echo "✗ Invalid branch name: '$BRANCH'"
            echo ""
            echo "Allowed conventions:"
            echo "  feature/KMP-123-short-description"
            echo "  bugfix/KMP-45-fix-login"
            echo "  hotfix/KMP-99-crash-ios"
            echo "  task/KMP-78-specific-task"
            echo "  release/1.2.0"
            echo "  chore/update-deps"
            exit 1
          fi
          echo "✓ Valid branch name: '$BRANCH'"

  # ── 3. Ensures main only receives release/* or hotfix/* ────
  validate-target-main:
    name: Protect main
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Check source branch for main
        env:
          SOURCE: ${{ github.head_ref }}
        run: |
          ALLOWED="^(release|hotfix)\/"
          if ! echo "$SOURCE" | grep -qE "$ALLOWED"; then
            echo "✗ Branch '$SOURCE' is not allowed to target main"
            echo ""
            echo "  Integrating a feature? Open a PR to develop."
            echo "  Releasing a version?   Use release/x.x.x"
            echo "  Production emergency?  Use hotfix/KMP-XX-description"
            exit 1
          fi
          echo "✓ Source branch allowed for main: '$SOURCE'"

  # ── 4. Ensures develop only receives feature/*, bugfix/*, task/* or chore/* ──
  validate-target-develop:
    name: Protect develop
    runs-on: ubuntu-latest
    if: github.base_ref == 'develop'
    steps:
      - name: Check source branch for develop
        env:
          SOURCE: ${{ github.head_ref }}
        run: |
          ALLOWED="^(feature|bugfix|task|chore)\/"
          if ! echo "$SOURCE" | grep -qE "$ALLOWED"; then
            echo "✗ Branch '$SOURCE' is not allowed to target develop"
            echo ""
            echo "Allowed branches for develop:"
            echo "  feature/KMP-123-new-feature   → new functionality"
            echo "  bugfix/KMP-45-fix-login        → bug found during development"
            echo "  task/KMP-78-specific-task      → short task or subtask"
            echo "  chore/update-deps              → quick maintenance"
            echo ""
            echo "  Production emergency? Use hotfix/* → main"
            exit 1
          fi
          echo "✓ Source branch allowed for develop: '$SOURCE'"

  # ── 5. Ensures release/* only receives bugfix/* or chore/* ─
  validate-target-release:
    name: Protect release
    runs-on: ubuntu-latest
    if: startsWith(github.base_ref, 'release/')
    steps:
      - name: Check source branch for release
        env:
          SOURCE: ${{ github.head_ref }}
        run: |
          ALLOWED="^(bugfix|chore)\/"
          if ! echo "$SOURCE" | grep -qE "$ALLOWED"; then
            echo "✗ Branch '$SOURCE' is not allowed to target a release branch"
            echo ""
            echo "Allowed branches for release/*:"
            echo "  bugfix/KMP-45-fix-login   → last-minute bug fix before launch"
            echo "  chore/update-deps          → dependency or config adjustment"
            echo ""
            echo "  New features are not allowed in a release branch."
            echo "  Schedule them for the next release cycle via develop."
            exit 1
          fi
          echo "✓ Source branch allowed for release: '$SOURCE'"

  # ── 7. Summary — all jobs must pass or be intentionally skipped ──
  summary:
    name: Git Flow OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate-pr-title
      - validate-branch-name
      - validate-target-main
      - validate-target-develop
      - validate-target-release
    steps:
      - name: Evaluate all job results
        env:
          PR_TITLE: ${{ needs.validate-pr-title.result }}
          BRANCH_NAME: ${{ needs.validate-branch-name.result }}
          TARGET_MAIN: ${{ needs.validate-target-main.result }}
          TARGET_DEVELOP: ${{ needs.validate-target-develop.result }}
          TARGET_RELEASE: ${{ needs.validate-target-release.result }}
        run: |
          echo "Results:"
          echo "  validate-pr-title:      $PR_TITLE"
          echo "  validate-branch-name:   $BRANCH_NAME"
          echo "  validate-target-main:   $TARGET_MAIN"
          echo "  validate-target-develop: $TARGET_DEVELOP"
          echo "  validate-target-release: $TARGET_RELEASE"
          echo ""

          # Eliminamos $TARGET_FEATURE de la lista del for
          for RESULT in "$PR_TITLE" "$BRANCH_NAME" "$TARGET_MAIN" "$TARGET_DEVELOP" "$TARGET_RELEASE"; do
            if [[ "$RESULT" != "success" && "$RESULT" != "skipped" ]]; then
              echo "✗ One or more Git Flow checks failed — merge is blocked"
              exit 1
            fi
          done

          echo "✓ All Git Flow checks passed successfully"